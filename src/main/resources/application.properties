spring.application.name=loginApp
# URL de conexão com o banco
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/loginapp

# Credenciais ${DB_USER} ${DB_PASSWORD}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

server.port=9000
#${BFF_CLIENT_SECRET}
bff.client.secret=ALT_control
bff.client.redirect-uri=${BFF_CALLBACK_URI:http://localhost:9000/bff/callback}
bff.authorization-uri=http://localhost:9000/oauth2/authorize
bff.client.id=bff-client

spring.data.redis.host=localhost
spring.data.redis.port=6379

bff.signing.keystore=file:${user.home}/.loginapp/auth-server.p12
bff.signing.alias=loginapp-signing
bff.signing.password=${JWK_KEYSTORE_PASSWORD}

app.frontend-url=http://localhost:4200