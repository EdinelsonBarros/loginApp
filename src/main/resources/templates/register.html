<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<main class="logincontainer">
    <div class="card">
        <div class="conteinerImg">
            <div class="imageBox">
                <img th:src="@{/images/backgroundLoginPage.jpg}" class="backimg">
                <div class="text-overlay">
                    <h1>Crie sua conta</h1>
                    <p>Preencha seus dados para se cadastrar.</p>
                </div>
            </div>
        </div>

        <div class="conteinerForm">
            <div>
                <img class="cardicon" th:src="@{/images/ellipse.png}">
            </div>

            <h2>Cadastro</h2>
            <p id="formError" class="alert" hidden></p>

            <form id="registerForm">
                <div class="conteinerInput">
                    <label for="name">Nome:</label>
                    <input class="inputLogin" type="text" id="name"
                           name="name" required autocomplete="name">
                </div>

                <div class="conteinerInput">
                    <label for="email">E-mail:</label>
                    <input class="inputLogin" type="email" id="email"
                           name="email" required autocomplete="email">
                </div>

                <div class="conteinerInput">
                    <label for="cpf">CPF:</label>
                    <input class="inputLogin" type="text" id="cpf"
                           name="cpf" required inputmode="numeric"
                           maxlength="11" pattern="[0-9]{11}"
                           placeholder="Somente números">
                </div>

                <div class="conteinerInput">
                    <label for="password">Senha:</label>
                    <input class="inputLogin" type="password" id="password"
                           name="password" required minlength="8"
                           autocomplete="new-password">
                </div>

                <div class="conteinerInput">
                    <label for="confirmPassword">Confirme a senha:</label>
                    <input class="inputLogin" type="password"
                           id="confirmPassword" name="confirmPassword"
                           required minlength="8" autocomplete="new-password">
                </div>

                <button class="btn" type="submit">CADASTRAR</button>
            </form>

            <p class="acesso">
                Já tem conta? <a th:href="@{/login}">Voltar ao login</a>
            </p>
        </div>
    </div>
</main>

<script>
    const form = document.getElementById('registerForm');
    const errorMessage = document.getElementById('formError');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorMessage.hidden = true;

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const cpf = document.getElementById('cpf').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword =
            document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            errorMessage.textContent = 'As senhas não conferem.';
            errorMessage.hidden = false;
            return;
        }

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name,
                    email,
                    cpf,
                    password,
                    confirmPassword
                })
            });

            if (response.status === 201) {
                window.location.assign('/login?registered=true');
                return;
            }

            errorMessage.textContent =
                response.status === 409
                    ? 'Este e-mail ou CPF já está cadastrado.'
                    : 'Não foi possível realizar o cadastro. Confira os dados.';
            errorMessage.hidden = false;
        } catch {
            errorMessage.textContent =
                'Não foi possível conectar ao servidor.';
            errorMessage.hidden = false;
        }
    });
</script>
</body>
</html>
