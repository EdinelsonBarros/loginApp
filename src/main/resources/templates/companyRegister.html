<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de empresa</title>
    <link rel="stylesheet" th:href="@{/css/companyRegister.css}">
</head>
<body>
<main class="page">

    <section class="card">
        <header class="card-header">
            <img class="card-icon" th:src="@{/images/ellipse.png}" alt="">
            <div>
                <h1>Cadastro de empresa</h1>
                <p class="subtitle">Preencha os dados para cadastrar a empresa no sistema.</p>
            </div>
        </header>

        <p th:if="${param.registered}" class="info" role="status">
            Empresa cadastrada com sucesso.
        </p>

        <form th:action="@{/companyRegister}"
              th:object="${companyForm}"
              method="post"
              class="form">

            <fieldset class="group">
                <legend>Dados da empresa</legend>

                <div class="field span-2">
                    <label for="nomeFantasia">Nome fantasia</label>
                    <input type="text" id="nomeFantasia" th:field="*{nomeFantasia}" required>
                    <small th:if="${#fields.hasErrors('nomeFantasia')}"
                           th:errors="*{nomeFantasia}" class="alert"></small>
                </div>

                <div class="field span-2">
                    <label for="companySocialName">Razão social</label>
                    <input type="text" id="companySocialName" th:field="*{companySocialName}" required>
                    <small th:if="${#fields.hasErrors('companySocialName')}"
                           th:errors="*{companySocialName}" class="alert"></small>
                </div>

                <div class="field">
                    <label for="cnpj">CNPJ</label>
                    <input type="text" id="cnpj" th:field="*{cnpj}" required
                           inputmode="numeric" maxlength="14" pattern="[0-9]{14}"
                           placeholder="Somente números">
                    <small th:if="${#fields.hasErrors('cnpj')}"
                           th:errors="*{cnpj}" class="alert"></small>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" required
                           placeholder="contato@empresa.com.br">
                    <small th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}" class="alert"></small>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>Endereço</legend>

                <div class="field">
                    <label for="postalCode">CEP</label>
                    <input type="text" id="postalCode" th:field="*{postalCode}"
                           inputmode="numeric" placeholder="00000-000">
                </div>

                <div class="field">
                    <label for="city">Cidade</label>
                    <input type="text" id="city" th:field="*{city}">
                </div>

                <div class="field span-2 address-row">
                    <div class="field">
                        <label for="address">Endereço</label>
                        <input type="text" id="address" th:field="*{address}">
                    </div>
                    <div class="field">
                        <label for="addressNumber">Número</label>
                        <input type="text" id="addressNumber" th:field="*{addressNumber}">
                    </div>
                </div>
            </fieldset>

            <button class="btn" type="submit">Cadastrar empresa</button>
        </form>
    </section>

</main>
</body>
</html>
